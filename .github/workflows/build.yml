name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Web builds do not need the Electron runtime download.
      # 웹 빌드에는 Electron 런타임 다운로드가 필요하지 않습니다.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build production web
        run: npm run build:web
      - name: Read project version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Upload the directory directly to avoid a ZIP nested inside the artifact ZIP.
      # Artifact ZIP 안에 ZIP이 중첩되지 않도록 폴더를 직접 업로드합니다.
      - name: Upload web build
        uses: actions/upload-artifact@v6
        with:
          name: fq4r-editor-v${{ steps.version.outputs.version }}-web
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            output: release/win-unpacked
            machine: 34404
          - arch: x86
            output: release/win-ia32-unpacked
            machine: 332
          - arch: arm64
            output: release/win-arm64-unpacked
            machine: 43620
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Package production desktop
        run: npm run package:desktop:${{ matrix.arch }}
      - name: Check packaged executable
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath '${{ matrix.output }}/fq4r-editor.exe')) {
            throw 'Packaged executable was not generated.'
          }
          $bytes = [System.IO.File]::ReadAllBytes('${{ matrix.output }}/fq4r-editor.exe')
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne ${{ matrix.machine }}) {
            throw 'Packaged executable architecture does not match the requested target.'
          }
      - name: Check packaged locales
        shell: pwsh
        run: |
          $expected = @('en-GB', 'en-US', 'ja', 'ko') | Sort-Object
          $actual = Get-ChildItem -LiteralPath '${{ matrix.output }}/locales' -Filter '*.pak' | ForEach-Object { $_.BaseName } | Sort-Object
          if (Compare-Object $expected $actual) {
            throw 'Packaged locales do not match the configured languages.'
          }
      - name: Read project version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Upload Windows app
        uses: actions/upload-artifact@v6
        with:
          name: fq4r-editor-v${{ steps.version.outputs.version }}-windows-${{ matrix.arch }}
          path: ${{ matrix.output }}/
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            machine: x86_64
          - arch: arm64
            machine: arm64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Package production macOS app
        run: npm run package:desktop:mac:${{ matrix.arch }}
      - name: Validate app and archive
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.machine }}
        run: |
          app=$(find release -maxdepth 3 -type d -name '*.app' -print -quit)
          test -n "$app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          actual=$(lipo -archs "$app/Contents/MacOS/$executable")
          test "$actual" = "$EXPECTED_ARCH"
          version=$(node -p "require('./package.json').version")
          unzip -t "release/fq4r-editor-v${version}-macos-${{ matrix.arch }}.zip"
      - name: Read project version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Archive the app first so macOS executable permissions and symlinks survive upload.
      # macOS 실행 권한과 심볼릭 링크를 보존하기 위해 앱을 먼저 압축합니다.
      - name: Upload macOS app
        uses: actions/upload-artifact@v6
        with:
          name: fq4r-editor-v${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}
          path: release/fq4r-editor-v${{ steps.version.outputs.version }}-macos-${{ matrix.arch }}.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            machine: 62
            elfClass: 2
          - arch: arm64
            machine: 183
            elfClass: 2
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Package production Linux app
        run: npm run package:desktop:linux:${{ matrix.arch }}
      - name: Validate executable and archive
        shell: bash
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
          EXPECTED_CLASS: ${{ matrix.elfClass }}
        run: |
          executable=$(find release -maxdepth 3 -type f -name fq4r-editor -print -quit)
          test -n "$executable"
          test -x "$executable"
          node --input-type=module - "$executable" <<'NODE'
          import { readFileSync } from 'node:fs';
          const bytes = readFileSync(process.argv[2]);
          if (bytes.subarray(0, 4).toString('hex') !== '7f454c46' || bytes[5] !== 1 || bytes[4] !== Number(process.env.EXPECTED_CLASS) || bytes.readUInt16LE(18) !== Number(process.env.EXPECTED_MACHINE)) {
            throw new Error('Packaged ELF architecture does not match the requested target.');
          }
          NODE
          version=$(node -p "require('./package.json').version")
          tar -tzf "release/fq4r-editor-v${version}-linux-${{ matrix.arch }}.tar.gz" > /dev/null
      - name: Read project version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Tar preserves Linux executable permissions and symlinks inside the artifact.
      # tar 파일로 Linux 실행 권한과 심볼릭 링크를 보존합니다.
      - name: Upload Linux app
        uses: actions/upload-artifact@v6
        with:
          name: fq4r-editor-v${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}
          path: release/fq4r-editor-v${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
